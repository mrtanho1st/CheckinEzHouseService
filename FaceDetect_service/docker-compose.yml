services:
  yunet-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: yunet-face-service:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      MODEL_PATH: /app/models/face_detection_yunet_2023mar.onnx
      SCORE_THRESHOLD: "0.6"
      NMS_THRESHOLD: "0.3"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    cpus: 1.0
    mem_limit: 512m
